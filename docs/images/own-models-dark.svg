pp runs its face models on the processor here)</text><path d="M330,302 h251 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-251 z" fill="#d95926"><title>Opsis 1, one face print, processor: 3 ms</title></path><text x="590" y="313" font-size="11" fill="#f0efec">3.00 ms</text><path d="M330,319 h43.60000000000002 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-43.60000000000002 z" fill="#199e70"><title>Melos 1, 4 s of voice, processor: 0.56 ms</title></path><text x="382.6" y="330" font-size="11" fill="#f0efec">0.56 ms</text><text x="320" y="386" font-size="12" text-anchor="end" fill="#f0efec">Windows laptop: i7-11800H, RTX 3080 Laptop</text><path d="M330,354 h81 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-81 z" fill="#3987e5"><title>Opsis 1, one face print, graphics processor: 1 ms</title></path><text x="420" y="365" font-size="11" fill="#f0efec">1.00 ms</text><path d="M330,371 h424.4000000000001 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-424.4000000000001 z" fill="#d95926"><title>Opsis 1, one face print, processor: 5.04 ms</title></path><text x="763.4000000000001" y="382" font-size="11" fill="#f0efec">5.04 ms</text><path d="M330,388 h48.69999999999999 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-48.69999999999999 z" fill="#199e70"><title>Melos 1, 4 s of voice, processor: 0.62 ms</title></path><text x="387.7" y="399" font-size="11" fill="#f0efec">0.62 ms</text>
