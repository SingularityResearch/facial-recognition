<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  /* Layout: viewfinder on the left, readout panel on the right; stacks on narrow screens */
  :root {
    --bg: #eef1f0; --panel: #ffffff; --fg: #18211f; --muted: #5d6b67;
    --line: #d3dbd8; --accent: #0e9f6e; --warn: #c2410c;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1413; --panel: #171e1c; --fg: #e4ebe8; --muted: #8b9a95;
            --line: #2a3431; --accent: #34d399; --warn: #fb923c; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 20px;
          grid-template-columns: minmax(0, 1fr) 300px; }
  @media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font: 600 22px var(--mono); letter-spacing: -.01em; }
  .status { font: 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .status.live .dot { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  .status.err { color: var(--warn); } .status.err .dot { background: var(--warn); }

  .stage { position: relative; background: #000; border-radius: 6px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .stage.mirror video, .stage.mirror canvas { transform: scaleX(-1); }
  .empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; color: #c9d4d0; padding: 24px; }
  .empty p { margin: 0; max-width: 40ch; }

  aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .label { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat b { display: block; font: 600 28px var(--mono); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  button { font: 600 13px var(--sans); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06231a; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .faces { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font: 12px var(--mono); font-variant-numeric: tabular-nums; }
  .faces li { display: flex; justify-content: space-between; gap: 8px; }
  .faces .none { color: var(--muted); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Face Tracker</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Loading model…</span></div>
  </header>

  <div class="stage mirror" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="empty" id="empty">
      <p>Start the camera, or open a video file. Detection runs entirely in your browser.</p>
    </div>
  </div>

  <aside>
    <div class="card">
      <div class="label">Source</div>
      <div class="row">
        <button class="primary" id="camBtn" disabled>Start camera</button>
        <button id="fileBtn" disabled>Open video</button>
        <input type="file" id="fileInput" accept="video/*" hidden>
      </div>
      <label for="camSelect" class="label" style="margin-top:4px">Camera</label>
      <select id="camSelect" style="font:13px var(--sans);padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)">
        <option value="">Default camera</option>
      </select>
    </div>

    <div class="card">
      <div class="label">Live readout</div>
      <div class="stats">
        <div class="stat"><b id="count">0</b><span>faces</span></div>
        <div class="stat"><b id="fps">0</b><span>frames / sec</span></div>
      </div>
      <ul class="faces" id="faces"><li class="none">No faces tracked</li></ul>
    </div>

    <div class="card">
      <div class="label">Display</div>
      <label class="toggle">Mirror view <input type="checkbox" id="optMirror" checked></label>
      <label class="toggle">Keypoints (eyes, nose, mouth, ears) <input type="checkbox" id="optPoints" checked></label>
      <label class="toggle">Motion trail <input type="checkbox" id="optTrail" checked></label>
      <label class="toggle">Blur faces <input type="checkbox" id="optBlur"></label>
      <div>
        <div class="toggle"><span>Smoothing</span><span id="smoothVal" style="font-family:var(--mono)">0.50</span></div>
        <input type="range" id="optSmooth" min="0" max="0.9" step="0.05" value="0.5">
      </div>
      <div>
        <div class="toggle"><span>Min. confidence</span><span id="confVal" style="font-family:var(--mono)">0.50</span></div>
        <input type="range" id="optConf" min="0.2" max="0.95" step="0.05" value="0.5">
      </div>
    </div>
  </aside>
</div>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const COLORS = ["#34d399", "#60a5fa", "#f472b6", "#fbbf24", "#a78bfa", "#f87171"];

let detector = null, stream = null, running = false, lastVideoTime = -1;
let tracks = [], nextId = 1, frames = 0, fpsT = performance.now();

function setStatus(text, cls = "") {
  $("statusText").textContent = text;
  $("status").className = "status " + cls;
}

async function init() {
  const MODEL = "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";
  let step = "detector engine (cdn.jsdelivr.net)";
  try {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    step = "face model (storage.googleapis.com)";
    const res = await fetch(MODEL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const buf = new Uint8Array(await res.arrayBuffer());
    step = "detector setup";
    const make = delegate => FaceDetector.createFromOptions(vision, {
      baseOptions: { modelAssetBuffer: buf, delegate },
      runningMode: "VIDEO", minDetectionConfidence: 0.3
    });
    try { detector = await make("GPU"); } catch { detector = await make("CPU"); }
    setStatus("Ready");
    $("camBtn").disabled = false; $("fileBtn").disabled = false;
  } catch (e) {
    const where = location.protocol === "file:" ? "" : " Open the downloaded file directly in Chrome or Edge.";
    setStatus(`Couldn't download the ${step}: ${e.message}.${where}`, "err");
    console.error(e);
  }
}

async function startCamera() {
  if (stream) { stopCamera(); return; }
  try {
    const id = $("camSelect").value;
    stream = await navigator.mediaDevices.getUserMedia({ video: {
      width: { ideal: 1280 }, height: { ideal: 720 },
      ...(id ? { deviceId: { exact: id } } : {})
    } });
    video.srcObject = stream; video.removeAttribute("src");
    listCameras(stream.getVideoTracks()[0]?.getSettings().deviceId);
    $("optMirror").checked = true; applyMirror();
    await video.play();
    $("camBtn").textContent = "Stop camera";
    begin();
  } catch (e) {
    stream = null;
    setStatus("Camera blocked. Allow camera access in your browser and try again.", "err");
  }
}

function stopCamera() {
  stream?.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null; running = false;
  $("camBtn").textContent = "Start camera";
  $("empty").hidden = false; tracks = []; ctx.clearRect(0, 0, canvas.width, canvas.height);
  renderList(); setStatus("Ready");
}

function openFile(file) {
  if (!file) return;
  if (stream) stopCamera();
  video.srcObject = null; video.src = URL.createObjectURL(file); video.loop = true;
  $("optMirror").checked = false; applyMirror();
  video.play().then(begin);
}

function begin() {
  $("empty").hidden = true; tracks = []; lastVideoTime = -1;
  setStatus("Tracking", "live");
  if (!running) { running = true; requestAnimationFrame(loop); }
}

// Match detections to existing tracks by nearest centre, then smooth.
function updateTracks(dets) {
  const alpha = 1 - parseFloat($("optSmooth").value);
  const used = new Set();
  for (const t of tracks) t.matched = false;
  for (const d of dets) {
    const b = d.boundingBox, cx = b.originX + b.width / 2, cy = b.originY + b.height / 2;
    let best = null, bestDist = Infinity;
    for (const t of tracks) {
      if (used.has(t)) continue;
      const dist = Math.hypot(t.cx - cx, t.cy - cy);
      if (dist < Math.max(t.w, b.width) * 0.8 && dist < bestDist) { best = t; bestDist = dist; }
    }
    const kp = d.keypoints.map(p => ({ x: p.x * canvas.width, y: p.y * canvas.height }));
    const score = d.categories[0]?.score ?? 0;
    if (best) {
      used.add(best); best.matched = true; best.missed = 0;
      best.x += (b.originX - best.x) * alpha; best.y += (b.originY - best.y) * alpha;
      best.w += (b.width - best.w) * alpha;   best.h += (b.height - best.h) * alpha;
      best.cx = best.x + best.w / 2; best.cy = best.y + best.h / 2;
      best.kp = best.kp.map((p, i) => ({ x: p.x + (kp[i].x - p.x) * alpha, y: p.y + (kp[i].y - p.y) * alpha }));
      best.score = score;
      best.trail.push({ x: best.cx, y: best.cy }); if (best.trail.length > 40) best.trail.shift();
    } else {
      const t = { id: nextId++, x: b.originX, y: b.originY, w: b.width, h: b.height, cx, cy, kp, score,
                  missed: 0, matched: true, trail: [{ x: cx, y: cy }], color: COLORS[(nextId - 2) % COLORS.length] };
      tracks.push(t); used.add(t);
    }
  }
  for (const t of tracks) if (!t.matched) t.missed++;
  tracks = tracks.filter(t => t.missed < 8);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const lw = Math.max(2, canvas.width / 400);
  for (const t of tracks) {
    if (t.missed > 0) ctx.globalAlpha = 0.4; else ctx.globalAlpha = 1;
    if ($("optBlur").checked) {
      ctx.save(); ctx.beginPath(); ctx.rect(t.x, t.y, t.w, t.h); ctx.clip();
      ctx.filter = `blur(${Math.round(t.w / 10)}px)`;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore(); ctx.filter = "none";
    }
    if ($("optTrail").checked && t.trail.length > 1) {
      ctx.strokeStyle = t.color; ctx.lineWidth = lw; ctx.globalAlpha *= 0.6;
      ctx.beginPath(); t.trail.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
      ctx.globalAlpha = t.missed > 0 ? 0.4 : 1;
    }
    // Corner brackets
    ctx.strokeStyle = t.color; ctx.lineWidth = lw * 1.5;
    const c = Math.min(t.w, t.h) * 0.2;
    ctx.beginPath();
    [[t.x, t.y, 1, 1], [t.x + t.w, t.y, -1, 1], [t.x, t.y + t.h, 1, -1], [t.x + t.w, t.y + t.h, -1, -1]].forEach(([x, y, dx, dy]) => {
      ctx.moveTo(x + dx * c, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * c);
    });
    ctx.stroke();
    if ($("optPoints").checked) {
      ctx.fillStyle = t.color;
      for (const p of t.kp) { ctx.beginPath(); ctx.arc(p.x, p.y, lw * 1.5, 0, Math.PI * 2); ctx.fill(); }
    }
    // Label (counter-flip when mirrored so text stays readable)
    const mirrored = $("optMirror").checked;
    const label = `#${t.id}  ${(t.score * 100).toFixed(0)}%`;
    ctx.font = `600 ${Math.max(12, canvas.width / 55)}px "IBM Plex Mono", monospace`;
    const tw = ctx.measureText(label).width + 12, th = Math.max(18, canvas.width / 40);
    ctx.save();
    if (mirrored) { ctx.translate(t.x + t.w, 0); ctx.scale(-1, 1); ctx.translate(-t.x, 0); }
    ctx.fillStyle = t.color; ctx.fillRect(t.x, t.y - th - 4, tw, th);
    ctx.fillStyle = "#06231a"; ctx.textBaseline = "middle"; ctx.fillText(label, t.x + 6, t.y - th / 2 - 4);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function renderList() {
  const live = tracks.filter(t => t.missed === 0);
  $("count").textContent = live.length;
  const ul = $("faces");
  if (!tracks.length) { ul.innerHTML = '<li class="none">No faces tracked</li>'; return; }
  ul.innerHTML = tracks.map(t => {
    const px = Math.round(t.cx), py = Math.round(t.cy);
    return `<li><span><span class="sw" style="background:${t.color}"></span>#${t.id}</span>` +
           `<span>x ${px} · y ${py} · ${Math.round(t.w)}px${t.missed ? " · lost" : ""}</span></li>`;
  }).join("");
}

function loop() {
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    const minConf = parseFloat($("optConf").value);
    const res = detector.detectForVideo(video, performance.now());
    updateTracks(res.detections.filter(d => (d.categories[0]?.score ?? 0) >= minConf));
    draw(); frames++;
    if (frames % 5 === 0) renderList();
  }
  const now = performance.now();
  if (now - fpsT > 1000) { $("fps").textContent = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
  requestAnimationFrame(loop);
}

// Camera names only appear after permission is granted, so refresh the list after starting.
async function listCameras(activeId) {
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    const sel = $("camSelect"), keep = activeId || sel.value;
    sel.innerHTML = '<option value="">Default camera</option>' +
      cams.map((c, i) => `<option value="${c.deviceId}">${c.label || "Camera " + (i + 1)}</option>`).join("");
    if (keep) sel.value = keep;
  } catch {}
}

$("camSelect").onchange = async () => { if (stream) { stopCamera(); await startCamera(); } };
navigator.mediaDevices?.addEventListener?.("devicechange", () => listCameras());
listCameras();

function applyMirror() { $("stage").classList.toggle("mirror", $("optMirror").checked); }

$("camBtn").onclick = startCamera;
$("fileBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => openFile(e.target.files[0]);
$("optMirror").onchange = applyMirror;
$("optSmooth").oninput = e => $("smoothVal").textContent = (+e.target.value).toFixed(2);
$("optConf").oninput = e => $("confVal").textContent = (+e.target.value).toFixed(2);

init();
</script>
</body>
</html>
