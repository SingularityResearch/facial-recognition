[package]
name = "face-core"
description = "The recognition core every platform shares"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the picture of a collected face is written as a JPEG (Collect faces)
jpeg-encoder = "0.7.1"
miniz_oxide = "0.9.1"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["api-24", "std"] }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

# The model runtime's library is loaded when the program starts, from wherever it is installed, on every system
# but iOS, where an app may only run what is linked into it. The faster paths' code (DirectML, NNAPI, ...) costs
# nothing where the loaded library lacks them; linked in, each would have to be in the library.
[target.'cfg(not(target_os = "ios"))'.dependencies]
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "coreml", "directml", "nnapi", "xnnpack"] }

# On Windows the Visual C++ runtime's libraries shipped beside the model runtime's are loaded by their own path
# first (runtime.rs `vc_runtime_beside`); the same crate the model runtime is loaded with.
[target.'cfg(windows)'.dependencies]
libloading = "0.9.1"

[target.'cfg(target_os = "ios")'.dependencies]
ort = { version = "2.0.0-rc.15", default-features = false, features = ["coreml", "xnnpack"] }

[dev-dependencies]
serde_json = "1.0.154"
