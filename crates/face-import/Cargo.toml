[package]
name = "face-import"
description = "Photos and videos read into the library: the decoders, and the importer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
face-core = { version = "2.0.0", path = "../face-core" }
face-files = { version = "2.0.0", path = "../face-files" }
face-library = { version = "2.0.0", path = "../face-library" }
# GIF and PNG: any correct decoder gives the same pixels
gif = "0.14"
png = "0.18"
# WebP, in Rust
image-webp = "0.2"
# the HEIC decoder (libheif with libde265) is a library of its own beside the program, loaded when it is needed
libloading = "0.9"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# JPEG: libjpeg-turbo itself, built from its source with this crate and linked in (its licence allows that).
# Its integer decoding gives the same pixels on every processor, at full size and at 1/2, 1/4 and 1/8
turbojpeg = { version = "1.5", default-features = false, features = ["cmake"] }
