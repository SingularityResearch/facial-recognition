[package]
name = "face-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
face-files = { version = "2.0.0", path = "../face-files" }
# unpacking: a wheel and a zip are read here (zip.rs), their packed bytes by this
flate2 = "1.1"
# SHA-256: the library the TLS connections already use
ring = "0.17"
serde_json = "1.0.154"
# source archives (.tar.gz), unpacked only below the folder they are given
tar = { version = "0.4.46", default-features = false }
# HTTPS with the certificate authorities built in, so a new computer needs nothing set up first
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
