[package]
name = "face-desktop"
description = "The app on a computer: one window, the system's own web view, around the app's programs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "FaceRecognizer"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.34"

[dependencies]
face-server = { version = "2.0.0", path = "../../crates/face-server" }

# the window: Windows and macOS (Linux and the Raspberry Pi open the tab page in the browser for now, and
# their program is built without the window's libraries)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37.3"
wry = "0.57.3"

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
muda = "0.21.2"
objc2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
