# Runs the tests and checkers on every push and pull request, on Windows, macOS and Linux, then builds the app for
# each (job "build"). The tests are light on purpose: no Git LFS download (models and data aren't needed: they use a
# made-up data folder, local test servers and no models), no camera, no network beyond installing packages.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved to other code); the comment names the release.

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: face-recognizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22"
      - name: Browser code tests (expression.js, signals.js, settings_bridge.js) and page scripts
        run: node --test tests/*.test.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test requirements
        # headless OpenCV here; the app itself uses opencv-contrib-python (requirements.txt)
        run: pip install -r requirements-dev.txt numpy==2.5.4 opencv-contrib-python-headless==5.0.0.93 truststore==0.10.5
      - name: "Python checker (ruff, with the pyflakes rules; ruff.toml)"
        run: python -m ruff check .
      - name: Python tests
        run: python -m pytest tests -q

  # The app, built on each system with build_exe.py (as build_app.bat does on Windows), once every system's checks
  # pass. Kept 14 days as build artifacts for testing; releases are still made by hand.
  #   Windows  FaceRecognizer.exe
  #   macOS    FaceRecognizer.app (Apple Silicon, macOS 14+), zipped; signed and notarized when the signing secrets
  #            are set (packaging/macos/sign_and_notarize.sh), else signed for local use only ("ad hoc")
  #   Linux    the FaceRecognizer folder with its Qt app window, as .tar.gz (built on Ubuntu 22.04: runs on 22.04+)
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest      # Apple Silicon; the app itself targets macOS 14+ (build_exe.py)
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    defaults:
      run:
        working-directory: face-recognizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          lfs: false          # the app carries code and pages only; it downloads its models on first start
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: face-recognizer/requirements*.txt
      - name: Install build requirements
        run: pip install -r requirements-build.txt
      - name: Install the Linux app window (Qt) and the system libraries it needs
        if: runner.os == 'Linux'
        # The runner's Azure package mirror sometimes can't be resolved (2026-11-11: two runs failed): try again,
        # from Ubuntu's own mirror, before giving up.
        run: |
          PKGS="libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3
                libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2"
          for try in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 $PKGS; then break; fi
            echo "apt failed (try $try): using archive.ubuntu.com instead of the Azure mirror"
            sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list \
              /etc/apt/sources.list.d/* 2>/dev/null || true
            sleep 20
          done
          dpkg -s $PKGS > /dev/null
          pip install "pywebview[qt]==6.2.1"
      - name: Build
        run: python build_exe.py --no-copy
      - name: Sign and notarize (macOS, when the signing secrets are set)
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: packaging/macos/sign_and_notarize.sh build/dist/FaceRecognizer.app
      - name: Package
        shell: bash
        run: |
          cd build/dist
          case "${{ runner.os }}" in
            Windows) PKG=FaceRecognizer.exe ;;
            macOS)   PKG=FaceRecognizer-macos-arm64.zip; ditto -c -k --keepParent FaceRecognizer.app "$PKG" ;;
            Linux)   PKG=FaceRecognizer-linux-x64.tar.gz; tar czf "$PKG" FaceRecognizer ;;
          esac
          python - "$PKG" <<'PY'
          import hashlib, json, os, sys
          pkg = sys.argv[1]
          info = {"project": "facial-recognition", "system": os.environ["SYSTEM"], "file": pkg,
                  "commit": os.environ["GITHUB_SHA"], "ref": os.environ["GITHUB_REF_NAME"],
                  "run": os.environ["GITHUB_RUN_ID"], "signed": os.environ["SIGNED"] == "true",
                  "sha256": hashlib.sha256(open(pkg, "rb").read()).hexdigest()}
          json.dump(info, open("BUILD-INFO.json", "w"), indent=1)
          PY
          echo "PKG=$PKG" >> "$GITHUB_ENV"
        env:
          SYSTEM: ${{ matrix.name }}
          SIGNED: ${{ runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: FaceRecognizer-${{ matrix.name }}
          path: |
            face-recognizer/build/dist/${{ env.PKG }}
            face-recognizer/build/dist/BUILD-INFO.json
          retention-days: 14
          if-no-files-found: error
