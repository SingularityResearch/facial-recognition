# Runs the tests and checkers on every push and pull request, on Windows, macOS and Linux, then builds the app for
# each (job "build"). The tests are light on purpose: no Git LFS download (models and data aren't needed: they use a
# made-up data folder, local test servers and no models), no camera, no network beyond installing packages.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved to other code); the comment names the release.

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: face-recognizer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - name: Browser code tests (expression.js, signals.js, settings_bridge.js) and page scripts
        run: node --test tests/*.test.js
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test requirements
        # headless OpenCV here; the app itself uses opencv-contrib-python (requirements.txt)
        run: pip install -r requirements-dev.txt numpy==2.5.4 opencv-contrib-python-headless==5.0.0.93 truststore==0.10.5 "psycopg[binary]==3.3.9" pgvector==0.5.1 cryptography==50.0.2
      - name: "Python checker (ruff, with the pyflakes rules; ruff.toml)"
        run: python -m ruff check .
      - name: Python tests
        run: python -m pytest tests -q

  # The shared-database tests (tests/test_facedb.py and others that need FACE_TEST_PG) against PostgreSQL with
  # pgvector in a service container. Service containers run on Linux only, so this is its own job.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FACE_TEST_PG: "host=127.0.0.1 port=5432 dbname=postgres user=postgres password=test sslmode=disable"
    defaults:
      run:
        working-directory: face-recognizer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: pip install -r requirements-dev.txt numpy==2.5.4 opencv-contrib-python-headless==5.0.0.93 truststore==0.10.5 "psycopg[binary]==3.3.9" pgvector==0.5.1 cryptography==50.0.2 pillow==13.0.0 pillow-heif==1.8.1
      - name: Shared-database tests
        run: python -m pytest tests -q -k "facedb or sync"

  # The app, built on each system with build_exe.py (as build_app.bat does on Windows), once every system's checks
  # pass. Kept 14 days as build artifacts for testing; releases are still made by hand.
  #   Windows  FaceRecognizer.exe; signed, with its installer and uninstaller, when the signing secrets are set and
  #            the push is to main (build_exe.py, "Windows code signing": Azure Artifact Signing, which this job signs
  #            in to as this repository's workflow, with no stored password), else unsigned
  #   macOS   FaceRecognizer.app (Apple Silicon, macOS 14+), zipped; signed and notarized when the signing secrets
  #            are set (packaging/macos/sign_and_notarize.sh), else signed for local use only ("ad hoc")
  #   Linux    the FaceRecognizer folder with its Qt app window, as .tar.gz (built on Ubuntu 22.04: runs on 22.04+)
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest      # Apple Silicon; the app itself targets macOS 14+ (build_exe.py)
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # lets the job say to Azure which repository and branch it runs for (Windows signing)
    env:
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' }}
      # Only pushes to main: Azure trusts this workflow for that branch alone (README, "Signing the Windows app")
      HAS_WIN_SIGNING: ${{ matrix.name == 'windows-x64' && secrets.AZURE_SIGNING_ACCOUNT != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: face-recognizer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          lfs: false          # the app carries code and pages only; it downloads its models on first start
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: face-recognizer/requirements*.txt
      - name: Install build requirements
        run: pip install -r requirements-build.txt
      - name: Install the Linux app window (Qt) and the system libraries it needs
        if: runner.os == 'Linux'
        # The runner's Azure package mirror sometimes can't be resolved (2026-11-11: two runs failed): try again,
        # from Ubuntu's own mirror, before giving up.
        run: |
          PKGS="libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3
                libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2"
          for try in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 $PKGS; then break; fi
            echo "apt failed (try $try): using archive.ubuntu.com instead of the Azure mirror"
            sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list \
              /etc/apt/sources.list.d/* 2>/dev/null || true
            sleep 20
          done
          dpkg -s $PKGS > /dev/null
          pip install "pywebview[qt]==6.2.1"
      - name: Build
        run: python build_exe.py --no-copy
      - name: Sign and notarize (macOS, when the signing secrets are set)
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: packaging/macos/sign_and_notarize.sh build/dist/FaceRecognizer.app
      # Windows: the sign-in is good for a few minutes only, so it comes right before each signing, not before the build
      - name: Sign in to Azure (Windows, when the signing secrets are set)
        if: env.HAS_WIN_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906   # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign the .exe (Windows, when the signing secrets are set)
        if: env.HAS_WIN_SIGNING == 'true'
        env:
          FACE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          FACE_SIGN_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          FACE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        run: python build_exe.py --sign
      # The built app loads every library it is made of and uses each once (app.py --self-test): a library left out
      # of the package fails here. On macOS this runs after signing: the hardened runtime of a signed app refuses
      # what an unsigned one loads, and there may be no Mac at hand to notice. On Windows after signing too: the
      # one-file .exe finds what it carries from its own end, where a signature is added.
      - name: Self-test of the built app
        shell: bash
        run: |
          export FACE_HOME=build/selftest-home FACE_ROOT=build/selftest-root
          case "${{ runner.os }}" in
            Windows) APP=build/dist/FaceRecognizer.exe ;;
            macOS)   APP=build/dist/FaceRecognizer.app/Contents/MacOS/FaceRecognizer ;;
            Linux)   APP=build/dist/FaceRecognizer/FaceRecognizer ;;
          esac
          code=0; "$APP" --self-test || code=$?
          cat build/selftest-home/self-test.txt
          exit $code
      # The installer, which puts the app in place and gives it icons (build_exe.py: Inno Setup on Windows, which
      # GitHub's Windows machines have; a .dmg on macOS, after signing; a file that installs itself on Linux)
      - name: Sign in to Azure again for the installer (Windows, when the signing secrets are set)
        if: env.HAS_WIN_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906   # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Installer
        env:      # Windows, signing: Inno Setup signs the uninstaller and the installer through build_exe.py
          FACE_SIGN_ACCOUNT: ${{ env.HAS_WIN_SIGNING == 'true' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          FACE_SIGN_PROFILE: ${{ env.HAS_WIN_SIGNING == 'true' && secrets.AZURE_SIGNING_PROFILE || '' }}
          FACE_SIGN_ENDPOINT: ${{ env.HAS_WIN_SIGNING == 'true' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
        run: python build_exe.py --installer-only
      - name: The .exe and the installer are signed, trusted by Windows and dated (Windows, when signing)
        if: env.HAS_WIN_SIGNING == 'true'
        run: python build_exe.py --signed
      - name: Sign and notarize the .dmg (macOS, when the signing secrets are set)
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: packaging/macos/sign_and_notarize.sh build/dist/FaceRecognizer-macos-arm64.dmg
      - name: Try the Linux installer (install, start entry and icons there, uninstall; in a home folder of its own)
        if: runner.os == 'Linux'
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME=
          mkdir -p "$HOME/Desktop" "$HOME/.local/share/FaceRecognizer/data"
          sh build/dist/FaceRecognizer-linux-x64.run
          test -x "$HOME/.local/lib/FaceRecognizer/FaceRecognizer"
          grep -q '^Icon=.*FaceRecognizer.png$' "$HOME/.local/share/applications/FaceRecognizer.desktop"
          test -s "$HOME/.local/share/icons/hicolor/512x512/apps/FaceRecognizer.png" -a -f "$HOME/Desktop/FaceRecognizer.desktop"
          sh "$HOME/.local/lib/FaceRecognizer/uninstall.sh"
          test ! -e "$HOME/.local/lib/FaceRecognizer" -a ! -e "$HOME/.local/share/applications/FaceRecognizer.desktop"
          test -d "$HOME/.local/share/FaceRecognizer/data"
      - name: Package
        shell: bash
        run: |
          cd build/dist
          case "${{ runner.os }}" in
            Windows) PKG=FaceRecognizer.exe; SETUP=FaceRecognizer-Setup-x64.exe ;;
            macOS)   PKG=FaceRecognizer-macos-arm64.zip; SETUP=FaceRecognizer-macos-arm64.dmg
                     ditto -c -k --keepParent FaceRecognizer.app "$PKG" ;;
            Linux)   PKG=FaceRecognizer-linux-x64.tar.gz; SETUP=FaceRecognizer-linux-x64.run
                     tar czf "$PKG" FaceRecognizer ;;
          esac
          python - "$PKG" "$SETUP" <<'PY'
          import hashlib, json, os, sys
          pkg, setup = sys.argv[1:3]
          sha = lambda f: hashlib.sha256(open(f, "rb").read()).hexdigest()
          info = {"project": "facial-recognition", "system": os.environ["SYSTEM"], "file": pkg,
                  "commit": os.environ["GITHUB_SHA"], "ref": os.environ["GITHUB_REF_NAME"],
                  "run": os.environ["GITHUB_RUN_ID"], "signed": os.environ["SIGNED"] == "true",
                  "sha256": sha(pkg), "installer": setup, "installer_sha256": sha(setup)}
          json.dump(info, open("BUILD-INFO.json", "w"), indent=1)
          PY
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "SETUP=$SETUP" >> "$GITHUB_ENV"
        env:
          SYSTEM: ${{ matrix.name }}
          SIGNED: ${{ (runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true') || env.HAS_WIN_SIGNING == 'true' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: FaceRecognizer-${{ matrix.name }}
          path: |
            face-recognizer/build/dist/${{ env.PKG }}
            face-recognizer/build/dist/${{ env.SETUP }}
            face-recognizer/build/dist/BUILD-INFO.json
          retention-days: 14
          if-no-files-found: error
